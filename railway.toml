# ─── Railway config ─────────────────────────────────────────────────────────
# Tells Railway how to build & run the @strickin/api service.
# Root Directory côté dashboard Railway doit être laissé à "/" (racine monorepo).

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
startCommand = "node apps/api/dist/main.js"
# Use the non-prefixed /health route (liveness only, no DB touch).
# Timeout bumped to 300s to accommodate cold-start + Prisma client init.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Only rebuild when something in the API or its shared deps changes.
[build.watch]
paths = [
  "apps/api/**",
  "packages/shared/**",
  "packages/design-system/**",
  "package.json",
  "package-lock.json",
  "tsconfig.base.json",
  "railway.toml",
  "apps/api/Dockerfile",
]
